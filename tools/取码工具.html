<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>记账Book · 卡密取码工具</title>
<style>
  :root{
    --bg:#f4f6f5; --card:#ffffff; --line:#e6e9e7; --txt:#1f2422;
    --mute:#7b8480; --green:#0e7a5f; --green2:#12946f;
    --yellow:#fff8e6; --yellowLine:#f0d79a; --red:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:960px;margin:0 auto;padding:24px 20px 60px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--mute);font-size:12px;margin-bottom:18px}
  .stats{display:flex;gap:10px;margin-bottom:14px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
  .stat b{display:block;font-size:22px;line-height:1.2}
  .stat span{color:var(--mute);font-size:12px}
  .alert{display:none;background:var(--yellow);border:1px solid var(--yellowLine);
    border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
  .alert.on{display:block}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin-bottom:16px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button{font:inherit;border-radius:9px;border:1px solid var(--line);
    background:#fff;padding:9px 14px;cursor:pointer}
  button:hover{border-color:#cfd6d3}
  button.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:600;
    padding:12px 20px;font-size:15px}
  button.primary:hover{background:var(--green2)}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:8px;
    padding:7px 10px;background:#fff;color:var(--txt)}
  input.w60{width:70px}
  textarea{width:100%;min-height:64px;resize:vertical}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--mute);font-weight:500;font-size:12px}
  code{font-family:ui-monospace,Consolas,monospace;letter-spacing:.5px}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px}
  .tag.unused{background:#e8f5f0;color:#0e7a5f}
  .tag.sold{background:#fff1e0;color:#a4600f}
  .tag.used{background:#f0f0f2;color:#6b6b73}
  td .mini{padding:5px 9px;font-size:12px;border-radius:7px}
  .hidden{display:none}
  .hint{color:var(--mute);font-size:12px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
    background:#1f2422;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
    opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>记账Book · 卡密取码工具</h1>
  <div class="sub">纯本地页面，数据只存在这台电脑的浏览器里（localStorage），不联网、不上传。</div>

  <div class="stats">
    <div class="stat"><b id="nUnused">0</b><span>未售（可直接卖）</span></div>
    <div class="stat"><b id="nSold">0</b><span>已售（已复制给买家）</span></div>
    <div class="stat"><b id="nUsed">0</b><span>已兑换（买家已在小程序激活）</span></div>
    <div class="stat"><b id="nTotal">0</b><span>总张数</span></div>
  </div>

  <div id="alert" class="alert"></div>

  <div class="panel">
    <div class="row">
      <button class="primary" id="btnTake">取一张码（复制并标已售）</button>
      <span class="hint">复制的内容直接粘到闲鱼聊天窗口即可。</span>
    </div>
    <div style="margin-top:12px" class="row">
      <label class="hint">快捷短语：</label>
      <select id="tplSel">
        <option value="1">标准版（含使用说明）</option>
        <option value="2">极简版（只有卡密）</option>
        <option value="0">自定义</option>
      </select>
      <button id="btnCopyTpl">复制当前短语（不带码）</button>
    </div>
    <textarea id="tpl" style="margin-top:10px"></textarea>
    <div class="hint" style="margin-top:6px">占位符 <code>{CODE}</code> 会被替换成卡密，<code>{DAYS}</code> 替换成天数。</div>
  </div>

  <div class="panel">
    <div class="row">
      <span class="hint">库存告警阈值</span>
      <input class="w60" id="thres" type="number" min="0" value="5">
      <span class="hint">张，低于它就在上面亮黄条</span>
      <span style="flex:1"></span>
      <button id="btnGen">库存不够 → 生成新批次</button>
      <button id="btnExportJson">导出 JSON（导入云开发用）</button>
      <button id="btnExportCsv">导出 CSV（对账用）</button>
    </div>
    <div class="row" style="margin-top:10px">
      <span class="hint">新批次</span>
      <input class="w60" id="genCount" type="number" min="1" value="20">
      <span class="hint">张 /</span>
      <input class="w60" id="genDays" type="number" min="1" value="365">
      <span class="hint">天</span>
      <span class="hint">（生成后仍要手动导入云开发数据库，否则买家兑不了）</span>
    </div>
  </div>

  <div class="panel">
    <div class="row" style="margin-bottom:10px">
      <input id="filter" placeholder="搜索卡密 / 批次 / 备注" style="flex:1">
      <select id="filterState">
        <option value="all">全部状态</option>
        <option value="unused">未售</option>
        <option value="sold">已售</option>
        <option value="used">已兑换</option>
      </select>
      <button id="btnReset">重置本机记录</button>
    </div>
    <table>
      <thead><tr><th style="width:150px">卡密</th><th style="width:90px">状态</th><th style="width:66px">天数</th>
      <th style="width:120px">批次</th><th>买家备注</th><th style="width:170px">操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>
<div class="toast" id="toast"></div>

function now(){ return Date.now() }
function fmt(ts){ if(!ts) return '—'; var d=new Date(ts);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes()) }
function pad(n){ return ('0'+n).slice(-2) }

/* ---------------- 存储 ---------------- */
function load(){
  var raw = localStorage.getItem(STORE_KEY);
  if(raw){ try{ return JSON.parse(raw) }catch(e){} }
  // 首次：把种子码写进来
  var list = SEED.map(function(o){ return {
    code:o.code, codeText:o.codeText, days:o.days, batch:o.batch,
    createdAt:o.createdAt||now(), state:'unused', soldAt:0, buyer:'', exported:false
  }});
  save(list); return list;
}
function save(list){ localStorage.setItem(STORE_KEY, JSON.stringify(list)) }

var DATA = load();

/* ---------------- 工具 ---------------- */
function randBytes(n){
  var a = new Uint8Array(n);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
  else for(var i=0;i<n;i++) a[i] = Math.floor(Math.random()*256);
  return a;
}
function makeCode(){
  var out = '';
  var bytes = randBytes(16);
  for(var i=0;i<16;i++) out += CHARSET[bytes[i] % CHARSET.length];
  return out;
}
function text(code){ return code.replace(/(.{4})(?=.)/g,'$1-') }
function newBatch(){
  var d = new Date();
  return 'B'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+pad(d.getHours())+pad(d.getMinutes());
}

function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove('on') }, 1600);
}
function copy(str){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(str).catch(function(){ fallbackCopy(str) });
  }
  fallbackCopy(str);
}
function fallbackCopy(str){
  var ta = document.createElement('textarea');
  ta.value = str; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy') }catch(e){}
  document.body.removeChild(ta);
}

/* ---------------- 渲染 ---------------- */
function stats(){
  var un=0, so=0, us=0;
  DATA.forEach(function(d){ if(d.state==='used') us++; else if(d.state==='sold') so++; else un++ });
  document.getElementById('nUnused').textContent = un;
  document.getElementById('nSold').textContent = so;
  document.getElementById('nUsed').textContent = us;
  document.getElementById('nTotal').textContent = DATA.length;

  var th = Number(document.getElementById('thres').value)||0;
  var el = document.getElementById('alert');
  if(un === 0){
    el.className = 'alert on';
    el.innerHTML = '<b>没码了。</b>买家现在下单你发不出东西——点下面「生成新批次」，生成后记得去云开发控制台导入 codes 集合。';
  } else if(un <= th){
    el.className = 'alert on';
    el.innerHTML = '<b>只剩 '+un+' 张了。</b>到 0 张就断货，建议现在就补一批（生成后仍需导入云开发）。';
  } else {
    el.className = 'alert';
  }
}

function render(){
  var q = (document.getElementById('filter').value||'').trim().toUpperCase();
  var st = document.getElementById('filterState').value;
  var tb = document.getElementById('tbody');
  var html = '';
  var shown = 0;
  DATA.forEach(function(d, idx){
    if(st !== 'all' && d.state !== st) return;
    if(q && (d.codeText+' '+d.batch+' '+(d.buyer||'')).toUpperCase().indexOf(q) === -1) return;
    shown++;
    var tag = d.state==='unused' ? '<span class="tag unused">未售</span>'
            : d.state==='sold' ? '<span class="tag sold">已售</span>'
            : '<span class="tag used">已兑换</span>';
    html += '<tr>'
      + '<td><code>'+d.codeText+'</code></td>'
      + '<td>'+tag+'</td>'
      + '<td>'+(d.days > 0 ? d.days + ' 天' : '永久')+'</td>'
      + '<td class="hint">'+d.batch+'</td>'
      + '<td>'+(d.buyer ? esc(d.buyer) : '<span class="hint">—</span>')+'</td>'
      + '<td>'
      + (d.state!=='used' ? '<button class="mini" data-act="used" data-i="'+idx+'">标记已兑换</button> ' : '')
      + (d.state!=='unused' ? '<button class="mini" data-act="back" data-i="'+idx+'">退回未售</button> ' : '')
      + '<button class="mini" data-act="copy" data-i="'+idx+'">复制</button>'
      + '</td></tr>';
  });
  if(!shown) html = '<tr><td colspan="6" class="hint">没有匹配的记录</td></tr>';
  tb.innerHTML = html;
  stats();
}

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }) }

/* ---------------- 交互 ---------------- */
document.getElementById('btnTake').addEventListener('click', function(){
  var next = DATA.find(function(d){ return d.state==='unused' });
  if(!next){ toast('没码了，先补一批'); return }
  var tpl = document.getElementById('tpl').value
    .replace(/\{CODE\}/g, next.codeText)
    .replace(/\{DAYS\}/g, next.days > 0 ? next.days : '永久');
  copy(tpl);
  next.state = 'sold'; next.soldAt = now();
  save(DATA); render();
  toast('已复制并标记已售：' + next.codeText);
});

document.getElementById('tbody').addEventListener('click', function(e){
  var btn = e.target.closest('button[data-act]');
  if(!btn) return;
  var i = Number(btn.dataset.i), act = btn.dataset.act, d = DATA[i];
  if(!d) return;
  if(act === 'used'){
    var buyer = prompt('买家备注（闲鱼昵称/订单后四位，可留空）：', d.buyer || '');
    if(buyer === null) return;
    d.buyer = buyer; d.state = 'used'; d.usedAt = now();
  } else if(act === 'back'){
    d.state = 'unused'; d.soldAt = 0;
  } else if(act === 'copy'){
    var tpl = document.getElementById('tpl').value
      .replace(/\{CODE\}/g, d.codeText).replace(/\{DAYS\}/g, d.days > 0 ? d.days : '永久');
    copy(tpl); toast('已复制：' + d.codeText);
  }
  save(DATA); render();
});

document.getElementById('thres').addEventListener('input', function(){
  localStorage.setItem('jzb_thres_v1', this.value); stats();
});
document.getElementById('tplSel').addEventListener('change', function(){
  document.getElementById('tpl').value = TPL[this.value];
  localStorage.setItem('jzb_tpl_v1', document.getElementById('tpl').value);
});
document.getElementById('tpl').addEventListener('input', function(){
  localStorage.setItem('jzb_tpl_v1', this.value);
});
document.getElementById('btnCopyTpl').addEventListener('click', function(){
  var txt = document.getElementById('tpl').value.replace(/\{CODE\}/g,'XXXX-XXXX-XXXX-XXXX')
    .replace(/\{DAYS\}/g,'365');
  copy(txt); toast('短语已复制');
});
document.getElementById('filter').addEventListener('input', render);
document.getElementById('filterState').addEventListener('change', render);

document.getElementById('btnGen').addEventListener('click', function(){
  var n = Math.max(1, Number(document.getElementById('genCount').value)||20);
  /* 填 0 或留空 = 永久卡（days 记 -1，云函数按永久算） */
  var raw = Number(document.getElementById('genDays').value);
  var days = (!raw || raw < 0) ? 0 : raw;
  var batch = newBatch();
  var added = [];
  for(var i=0;i<n;i++){
    var code, dup;
    do{ code = makeCode(); dup = DATA.some(function(d){ return d.code === code }) }while(dup);
    var item = { code:code, codeText:text(code), days:days, batch:batch,
      createdAt: now()+i, state:'unused', soldAt:0, buyer:'', exported:false };
    DATA.push(item); added.push(item);
  }
  save(DATA); render();
  toast('已加入 '+n+' 张（批次 '+batch+'），记得导出 JSON 并导入云开发');
});

document.getElementById('btnExportJson').addEventListener('click', function(){
  // 云开发「导入」认的格式：一行一个对象（JSON Lines），usedBy 必须是空字符串。
  // 只导出「还没导入过云端、且还没卖出去」的码：已售/已兑换的绝不能再导回去，
  // 否则同一个 code 在库里出现两条文档，会同时发给两个买家。
  var pending = DATA.filter(function(d){ return !d.exported && d.state === 'unused' });
  if(!pending.length){ toast('没有待导入的新码（都已导出过）'); return }
  var lines = pending.map(function(d){
    return JSON.stringify({
      code: d.code, codeText: d.codeText, days: d.days,
      usedBy: '', usedAt: 0, soldTo: d.buyer || '', batch: d.batch, createdAt: d.createdAt
    });
  });
  download('codes-' + newBatch() + '.json', lines.join('\n') + '\n');
  pending.forEach(function(d){ d.exported = true });
  save(DATA); render();
  toast('已导出 ' + pending.length + ' 张，去云开发控制台导入 codes 集合');
});

document.getElementById('btnExportCsv').addEventListener('click', function(){
  var head = '卡密,天数,批次,状态,售出时间,买家备注（soldTo）\n';
  var body = DATA.map(function(d){
    return [d.codeText, d.days, d.batch, d.state, fmt(d.soldAt), (d.buyer||'').replace(/,/g,'、')].join(',');
  }).join('\n');
  download('卡密对账-' + newBatch() + '.csv', '\ufeff' + head + body + '\n');
});

document.getElementById('btnReset').addEventListener('click', function(){
  if(!confirm('清空这台电脑上的卡密记录？\n（云端数据库不受影响，但你会丢掉「哪张已售/已兑换」的标记）')) return;
  localStorage.removeItem(STORE_KEY);
  DATA = load(); render(); toast('已重置');
});

function download(name, content){
  var blob = new Blob([content], {type:'text/plain;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove() }, 400);
}

/* ---------------- 启动 ---------------- */
document.getElementById('tpl').value = localStorage.getItem('jzb_tpl_v1') || TPL[1];
var th = localStorage.getItem('jzb_thres_v1');
if(th !== null) document.getElementById('thres').value = th;
render();
</script>
